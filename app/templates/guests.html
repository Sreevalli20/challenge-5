{% extends "base.html" %}

{% block title %}Guests — CELEBRATE{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <h1>Guest Management</h1>
            <p class="page-subtitle">Manage your guest list and track RSVPs</p>
        </div>
        <button onclick="showAddGuestModal()" class="btn btn-primary">Add Guest</button>
    </div>

    <div class="guest-stats">
        <div class="guest-stat">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="guest-stat confirmed">
            <span class="stat-label">Confirmed</span>
            <span class="stat-value" id="stat-confirmed">0</span>
        </div>
        <div class="guest-stat declined">
            <span class="stat-label">Declined</span>
            <span class="stat-value" id="stat-declined">0</span>
        </div>
        <div class="guest-stat pending">
            <span class="stat-label">Pending</span>
            <span class="stat-value" id="stat-pending">0</span>
        </div>
    </div>

    <div class="guest-list-container">
        <div class="guest-filters">
            <input type="text" id="guest-search" placeholder="Search guests..." onkeyup="filterGuests()">
            <select id="rsvp-filter" onchange="filterGuests()">
                <option value="">All RSVP Status</option>
                <option value="confirmed">Confirmed</option>
                <option value="declined">Declined</option>
                <option value="pending">Pending</option>
            </select>
        </div>
        <div id="guest-list" class="guest-list">
            <div class="loading-state">Loading guests...</div>
        </div>
    </div>
</div>

<!-- Add Guest Modal -->
<div id="guest-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add Guest</h2>
            <button onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <form id="guest-form">
            <div class="form-group">
                <label for="guest-name">Name *</label>
                <input type="text" id="guest-name" name="name" required>
            </div>
            <div class="form-group">
                <label for="guest-email">Email</label>
                <input type="email" id="guest-email" name="email">
            </div>
            <div class="form-group">
                <label for="guest-phone">Phone</label>
                <input type="tel" id="guest-phone" name="phone">
            </div>
            <div class="form-group">
                <label for="guest-dietary">Dietary Preferences</label>
                <input type="text" id="guest-dietary" name="dietary_preferences">
            </div>
            <div class="form-group">
                <label for="guest-requirements">Special Requirements</label>
                <textarea id="guest-requirements" name="special_requirements" rows="2"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Guest</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const eventId = {{ event_id }};
let guests = [];

async function loadGuests() {
    try {
        const response = await fetch(`/api/events/${eventId}/guests`);
        guests = await response.json();
        
        // Update stats
        document.getElementById('stat-total').textContent = guests.length;
        document.getElementById('stat-confirmed').textContent = guests.filter(g => g.rsvp_status === 'confirmed').length;
        document.getElementById('stat-declined').textContent = guests.filter(g => g.rsvp_status === 'declined').length;
        document.getElementById('stat-pending').textContent = guests.filter(g => g.rsvp_status === 'pending').length;
        
        renderGuests(guests);
    } catch (error) {
        console.error('Failed to load guests:', error);
    }
}

function renderGuests(guestList) {
    const container = document.getElementById('guest-list');
    
    if (guestList.length === 0) {
        container.innerHTML = '<div class="empty-state-small">No guests added yet</div>';
        return;
    }
    
    container.innerHTML = guestList.map(guest => `
        <div class="guest-card" data-rsvp="${guest.rsvp_status}" data-name="${guest.name.toLowerCase()}">
            <div class="guest-info">
                <h3>${guest.name}</h3>
                <p class="guest-meta">${guest.email || 'No email'} · ${guest.phone || 'No phone'}</p>
                ${guest.dietary_preferences ? `<p class="guest-dietary">Dietary: ${guest.dietary_preferences}</p>` : ''}
            </div>
            <div class="guest-actions">
                <select onchange="updateRSVP(${guest.id}, this.value)" class="rsvp-select rsvp-${guest.rsvp_status}">
                    <option value="pending" ${guest.rsvp_status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="confirmed" ${guest.rsvp_status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                    <option value="declined" ${guest.rsvp_status === 'declined' ? 'selected' : ''}>Declined</option>
                </select>
                <button onclick="editGuest(${guest.id})" class="btn btn-sm btn-secondary">Edit</button>
                <button onclick="deleteGuest(${guest.id})" class="btn btn-sm btn-danger">Delete</button>
            </div>
        </div>
    `).join('');
}

async function updateRSVP(guestId, status) {
    try {
        const response = await fetch(`/api/events/${eventId}/guests/${guestId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rsvp_status: status })
        });
        
        if (response.ok) {
            loadGuests();
        }
    } catch (error) {
        console.error('Failed to update RSVP:', error);
    }
}

async function deleteGuest(guestId) {
    if (!confirm('Are you sure you want to delete this guest?')) return;
    
    try {
        const response = await fetch(`/api/events/${eventId}/guests/${guestId}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            loadGuests();
        }
    } catch (error) {
        console.error('Failed to delete guest:', error);
    }
}

function showAddGuestModal() {
    document.getElementById('guest-modal').style.display = 'block';
}

function closeModal() {
    document.getElementById('guest-modal').style.display = 'none';
    document.getElementById('guest-form').reset();
}

function filterGuests() {
    const search = document.getElementById('guest-search').value.toLowerCase();
    const rsvpFilter = document.getElementById('rsvp-filter').value;
    
    const filtered = guests.filter(guest => {
        const matchesSearch = guest.name.toLowerCase().includes(search);
        const matchesRSVP = !rsvpFilter || guest.rsvp_status === rsvpFilter;
        return matchesSearch && matchesRSVP;
    });
    
    renderGuests(filtered);
}

// Form submission
document.getElementById('guest-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());
    
    try {
        const response = await fetch(`/api/events/${eventId}/guests`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            closeModal();
            loadGuests();
        }
    } catch (error) {
        console.error('Failed to add guest:', error);
    }
});

// Load guests on page load
document.addEventListener('DOMContentLoaded', loadGuests);
</script>
{% endblock %}
