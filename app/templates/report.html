{% extends "base.html" %}

{% block title %}Event Report — CELEBRATE{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <h1>Event Summary Report</h1>
            <p class="page-subtitle">Complete overview of your event planning progress</p>
        </div>
        <button onclick="window.print()" class="btn btn-primary">Print Report</button>
    </div>

    <div id="report-content" class="report-content">
        <div class="loading-state">Loading report...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const eventId = {{ event_id }};

async function loadReport() {
    try {
        const response = await fetch(`/api/events/${eventId}`);
        const event = await response.json();
        
        const reportHTML = `
            <div class="report-section">
                <h2>Event Details</h2>
                <div class="report-grid">
                    <div class="report-item">
                        <span class="report-label">Event Name</span>
                        <span class="report-value">${event.name}</span>
                    </div>
                    <div class="report-item">
                        <span class="report-label">Category</span>
                        <span class="report-value">${event.category.replace('_', ' ')}</span>
                    </div>
                    <div class="report-item">
                        <span class="report-label">Date & Time</span>
                        <span class="report-value">${new Date(event.date).toLocaleDateString()} at ${event.time}</span>
                    </div>
                    <div class="report-item">
                        <span class="report-label">Location</span>
                        <span class="report-value">${event.location}</span>
                    </div>
                    <div class="report-item">
                        <span class="report-label">Expected Guests</span>
                        <span class="report-value">${event.guest_count}</span>
                    </div>
                    <div class="report-item">
                        <span class="report-label">Theme</span>
                        <span class="report-value">${event.theme || 'Not specified'}</span>
                    </div>
                </div>
            </div>

            <div class="report-section">
                <h2>Guest Statistics</h2>
                <div class="report-stats">
                    <div class="report-stat">
                        <span class="stat-number">${event.guest_stats.total}</span>
                        <span class="stat-label">Total Invited</span>
                    </div>
                    <div class="report-stat">
                        <span class="stat-number confirmed">${event.guest_stats.confirmed}</span>
                        <span class="stat-label">Confirmed</span>
                    </div>
                    <div class="report-stat">
                        <span class="stat-number declined">${event.guest_stats.declined}</span>
                        <span class="stat-label">Declined</span>
                    </div>
                    <div class="report-stat">
                        <span class="stat-number pending">${event.guest_stats.pending}</span>
                        <span class="stat-label">Pending</span>
                    </div>
                </div>
            </div>

            <div class="report-section">
                <h2>Budget Summary</h2>
                <div class="report-budget">
                    <div class="budget-row">
                        <span class="budget-label">Total Budget</span>
                        <span class="budget-value">${event.currency} ${event.total_budget.toLocaleString()}</span>
                    </div>
                    <div class="budget-row">
                        <span class="budget-label">Estimated Expenses</span>
                        <span class="budget-value">${event.currency} ${event.budget_stats.total_estimated.toLocaleString()}</span>
                    </div>
                    <div class="budget-row">
                        <span class="budget-label">Actual Spent</span>
                        <span class="budget-value">${event.currency} ${event.budget_stats.total_actual.toLocaleString()}</span>
                    </div>
                    <div class="budget-row">
                        <span class="budget-label">Remaining</span>
                        <span class="budget-value ${event.budget_stats.remaining < 0 ? 'negative' : ''}">${event.currency} ${event.budget_stats.remaining.toLocaleString()}</span>
                    </div>
                    <div class="budget-row">
                        <span class="budget-label">Budget Utilization</span>
                        <span class="budget-value">${event.budget_stats.utilization_percent.toFixed(1)}%</span>
                    </div>
                    <div class="budget-row">
                        <span class="budget-label">Cost Per Guest</span>
                        <span class="budget-value">${event.currency} ${event.budget_stats.cost_per_guest.toFixed(2)}</span>
                    </div>
                </div>
            </div>

            <div class="report-section">
                <h2>Task Progress</h2>
                <div class="report-tasks">
                    <div class="task-progress-row">
                        <span class="task-label">Completed</span>
                        <span class="task-value">${event.task_stats.completed} / ${event.task_stats.total}</span>
                    </div>
                    <div class="task-progress-row">
                        <span class="task-label">Pending</span>
                        <span class="task-value">${event.task_stats.pending}</span>
                    </div>
                    <div class="task-progress-row">
                        <span class="task-label">Overdue</span>
                        <span class="task-value overdue">${event.task_stats.overdue}</span>
                    </div>
                </div>
            </div>

            ${event.ai_plan ? `
            <div class="report-section">
                <h2>AI Recommendations</h2>
                <div class="report-recommendations">
                    <h3>Event Concept</h3>
                    <p>${event.ai_plan.event_concept}</p>
                    
                    <h3>Recommended Theme</h3>
                    <p>${event.ai_plan.recommended_theme}</p>
                    
                    <h3>Key Recommendations</h3>
                    <ul>
                        ${event.ai_plan.personalized_recommendations.map(rec => `<li>${rec}</li>`).join('')}
                    </ul>
                </div>
            </div>
            ` : ''}

            <div class="report-section">
                <h2>Expense Breakdown</h2>
                ${event.expenses.length > 0 ? `
                    <table class="report-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Estimated</th>
                                <th>Actual</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${event.expenses.map(exp => `
                                <tr>
                                    <td>${exp.category}</td>
                                    <td>${exp.description}</td>
                                    <td>${event.currency} ${exp.estimated_cost.toLocaleString()}</td>
                                    <td>${event.currency} ${(exp.actual_cost || 0).toLocaleString()}</td>
                                    <td>${exp.paid ? 'Paid' : 'Unpaid'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                ` : '<p class="empty-state-small">No expenses recorded</p>'}
            </div>
        `;
        
        document.getElementById('report-content').innerHTML = reportHTML;
    } catch (error) {
        console.error('Failed to load report:', error);
        document.getElementById('report-content').innerHTML = '<p class="error">Failed to load report</p>';
    }
}

document.addEventListener('DOMContentLoaded', loadReport);
</script>
{% endblock %}
