{% extends "base.html" %}

{% block title %}Invitations — CELEBRATE{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <h1>Invitation Studio</h1>
            <p class="page-subtitle">Create beautiful invitations for your event</p>
        </div>
        <button onclick="showCreateModal()" class="btn btn-primary">Create Invitation</button>
    </div>

    <div class="invitations-list" id="invitations-list">
        <div class="loading-state">Loading invitations...</div>
    </div>
</div>

<!-- Create Invitation Modal -->
<div id="invitation-modal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2>Create Invitation</h2>
            <button onclick="closeModal()" class="modal-close">&times;</button>
        </div>
        <div class="invitation-creator">
            <div class="invitation-form">
                <form id="invitation-form">
                    <div class="form-group">
                        <label for="invitation-template">Template</label>
                        <select id="invitation-template" name="template" onchange="updatePreview()">
                            <option value="formal">Formal</option>
                            <option value="casual">Casual</option>
                            <option value="elegant">Elegant</option>
                            <option value="fun">Fun & Festive</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="invitation-colors">Color Scheme</label>
                        <select id="invitation-colors" name="colors" onchange="updatePreview()">
                            <option value="navy-gold">Navy & Gold</option>
                            <option value="rose-gold">Rose Gold</option>
                            <option value="forest-green">Forest Green</option>
                            <option value="classic-black">Classic Black</option>
                            <option value="soft-pastel">Soft Pastel</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="custom-wording">Custom Wording (Optional)</label>
                        <textarea id="custom-wording" name="custom_wording" rows="3" placeholder="Add your custom message..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" onclick="generateAIText()" class="btn btn-secondary">Generate with AI</button>
                        <button type="submit" class="btn btn-primary">Save Invitation</button>
                    </div>
                </form>
            </div>
            <div class="invitation-preview">
                <h3>Preview</h3>
                <div id="preview-card" class="invitation-card navy-gold">
                    <div id="preview-content" class="invitation-content">
                        <!-- Preview content will be updated -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const eventId = {{ event_id }};
let eventDetails = null;

async function loadInvitations() {
    try {
        // Load event details first
        const eventResponse = await fetch(`/api/events/${eventId}`);
        eventDetails = await eventResponse.json();
        
        // Load invitations
        const response = await fetch(`/api/events/${eventId}/invitations`);
        const invitations = await response.json();
        
        const container = document.getElementById('invitations-list');
        
        if (invitations.length === 0) {
            container.innerHTML = '<div class="empty-state-small">No invitations created yet</div>';
            return;
        }
        
        container.innerHTML = invitations.map(inv => `
            <div class="invitation-item">
                <div class="invitation-thumbnail ${inv.colors || 'navy-gold'}">
                    <div class="invitation-mini-content">
                        <h3>${eventDetails.name}</h3>
                        <p>${new Date(eventDetails.date).toLocaleDateString()}</p>
                    </div>
                </div>
                <div class="invitation-details">
                    <h3>${inv.template.replace('_', ' ')} Template</h3>
                    <p>${inv.colors ? inv.colors.replace('-', ' & ') : 'Default colors'}</p>
                </div>
                <div class="invitation-actions">
                    <button onclick="viewInvitation(${inv.id})" class="btn btn-sm btn-secondary">View</button>
                    <button onclick="downloadInvitation(${inv.id})" class="btn btn-sm btn-primary">Download</button>
                    <button onclick="deleteInvitation(${inv.id})" class="btn btn-sm btn-danger">Delete</button>
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error('Failed to load invitations:', error);
    }
}

function showCreateModal() {
    document.getElementById('invitation-modal').style.display = 'block';
    updatePreview();
}

function closeModal() {
    document.getElementById('invitation-modal').style.display = 'none';
    document.getElementById('invitation-form').reset();
}

async function generateAIText() {
    const template = document.getElementById('invitation-template').value;
    
    try {
        const response = await fetch(`/api/events/${eventId}/invitations/generate?template=${template}`, {
            method: 'POST'
        });
        const result = await response.json();
        
        if (response.ok) {
            document.getElementById('custom-wording').value = result.content;
            updatePreview();
            alert(`Invitation text generated using ${result.source}!`);
        } else {
            alert('Failed to generate text: ' + result.detail);
        }
    } catch (error) {
        alert('Failed to generate text: ' + error.message);
    }
}

function updatePreview() {
    const template = document.getElementById('invitation-template').value;
    const colors = document.getElementById('invitation-colors').value;
    const customWording = document.getElementById('custom-wording').value;
    
    const previewCard = document.getElementById('preview-card');
    previewCard.className = `invitation-card ${colors}`;
    
    const content = customWording || getDefaultContent(template);
    document.getElementById('preview-content').innerHTML = `<div class="invitation-text">${content.replace(/\n/g, '<br>')}</div>`;
}

function getDefaultContent(template) {
    if (!eventDetails) return '';
    
    const date = new Date(eventDetails.date).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
    
    const templates = {
        formal: `You are cordially invited to\n\n${eventDetails.name}\n\n${date} at ${eventDetails.time}\n${eventDetails.location}\n\nPlease RSVP by responding to this invitation.`,
        casual: `Hey! You're invited to\n\n${eventDetails.name}!\n\nWhen: ${date} at ${eventDetails.time}\nWhere: ${eventDetails.location}\n\nHope to see you there!`,
        elegant: `With joyous hearts, we invite you to celebrate\n\n${eventDetails.name}\n\n${date}\n${eventDetails.time}\n${eventDetails.location}\n\nYour presence would be greatly appreciated.`,
        fun: `🎉 You're Invited! 🎉\n\nJoin us for\n\n${eventDetails.name}\n\n📅 ${date}\n⏰ ${eventDetails.time}\n📍 ${eventDetails.location}\n\nIt's going to be amazing!`
    };
    
    return templates[template] || templates.formal;
}

async function saveInvitation() {
    const formData = new FormData(document.getElementById('invitation-form'));
    const data = Object.fromEntries(formData.entries());
    data.content = document.getElementById('custom-wording') || getDefaultContent(data.template);
    
    try {
        const response = await fetch(`/api/events/${eventId}/invitations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            closeModal();
            loadInvitations();
        }
    } catch (error) {
        console.error('Failed to save invitation:', error);
    }
}

function downloadInvitation(invitationId) {
    alert('Download feature: In a production environment, this would generate a PDF or image file of the invitation.');
}

async function deleteInvitation(invitationId) {
    if (!confirm('Are you sure you want to delete this invitation?')) return;
    
    try {
        const response = await fetch(`/api/events/${eventId}/invitations/${invitationId}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            loadInvitations();
        }
    } catch (error) {
        console.error('Failed to delete invitation:', error);
    }
}

document.getElementById('invitation-form').addEventListener('submit', function(e) {
    e.preventDefault();
    saveInvitation();
});

document.addEventListener('DOMContentLoaded', loadInvitations);
</script>
{% endblock %}
